services:
  postgres:
    image: postgres:17-alpine
    container_name: slotsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slotsync
      POSTGRES_PASSWORD: slotsync_dev
      POSTGRES_DB: slotsync
    ports:
      - "5432:5432"
    volumes:
      - slotsync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotsync -d slotsync"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: slotsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - slotsync-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  slotsync-postgres:
  slotsync-redis:
